# EduNexa Production Stack for Ubuntu 22.04 LTS (1 vCPU, 4 GB RAM) VPS
# Behind Host Nginx Reverse Proxy & Cloudflare (Full Strict)
# Host Nginx owns ports 80 & 443; this stack exposes Django web only on 127.0.0.1:${PORT:-8002}.

name: ${COMPOSE_PROJECT_NAME:-edunexa}

x-app: &app
  image: ${EDUNEXA_IMAGE:-edunexa:latest}
  build: .
  env_file: ${EDUNEXA_ENV_FILE:-.env}
  init: true
  stop_grace_period: 90s
  volumes:
    - media_data:/app/media
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgresql://edunexa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/edunexa?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    PYTHONPATH: /app
    TRUST_PROXY: "1"
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *app
    ports:
      # Exposes ONLY to localhost on the host. Host Nginx proxies to this port.
      - "127.0.0.1:${PORT:-8002}:8000"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-2} --timeout 60
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    <<: *app
    # Celery worker concurrency limited to 1 by default to prevent OOM on 1 vCPU / 4 GB RAM VPS
    command: celery -A config worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  beat:
    <<: *app
    # Exactly one scheduler instance for periodic jobs
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(not os.path.exists('/tmp/celerybeat-schedule'))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192M

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edunexa
      POSTGRES_USER: edunexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunexa -d edunexa"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *logging

volumes:
  postgres_data:
  media_data:
  redis_data:
